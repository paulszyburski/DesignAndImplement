<form action="/api/quote" method="POST">
    <input
        type="text"
        name="name"
        placeholder="Imię i nazwisko"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        type="tel"
        name="phone"
        placeholder="Telefon"
    >

    <textarea
        name="message"
        placeholder="Opisz swój ogród"
    ></textarea>

    <button type="submit">Bezpłatna wycena</button>
</form>
